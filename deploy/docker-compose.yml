services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Host port 5434: 5432 is a native PostgreSQL, 5433 is taken by another project.
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tracking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracking}
      POSTGRES_DB: ${POSTGRES_DB:-tracking}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-tracking}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
  # NOTE: rendered P&L cards use a bind mount (../artifacts, repo root) so
  # local `npm run dev` API and the worker share files. 7-day retention
  # enforced by the app. Old named volume `artifacts` is unused; prune it
  # with `docker volume rm deploy_artifacts` once empty.
