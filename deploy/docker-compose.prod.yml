# Production overlay: app services + infra hardening.
# Deploy only pinned images by digest (see docs/08-deploy/docker-cicd.md).
# NOTE: apps/worker (stub) is intentionally absent — it would restart-loop.
services:
  postgres:
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: tracking-trade-api:local
    env_file:
      - ../.env
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://tracking:tracking@postgres:5432/tracking
      REDIS_URL: redis://redis:6379
      ARTIFACTS_DIR: /data/artifacts
      # Operator bot lives in the API process: one HTTP service, one poller.
      OPERATOR_BOT_ENABLED: "true"
      # Card rendering (Chromium) runs inside the API; set "false" on extra
      # HTTP-only replicas.
      RENDER_WORKER_ENABLED: "true"
    volumes:
      # Bind mount (repo-root ./artifacts) so rendered PNGs are visible on the
      # host and survive container restarts. Do NOT use a named volume.
      - ../artifacts:/data/artifacts
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
