# Production deploy: push to main -> CI gate -> SSH to VPS ->
# git pull + compose build + migrate + up + healthcheck (+ rollback).
# Required repo secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY.
# Optional (deploy notify): TELEGRAM_BOT_TOKEN, ALERT_CHAT_ID.
name: deploy-production

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high --omit=dev
      - run: npx prisma validate --schema prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://u:p@localhost:5432/db

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: SSH setup
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Deploy on VPS
        id: deploy
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" <<'EOF'
          set -e
          cd /opt/tracking_trade
          install -d -o 100 -g 101 /opt/tracking_trade/artifacts
          chown -R 100:101 /opt/tracking_trade/artifacts
          PREV_SHA=$(git rev-parse HEAD)
          echo "previous=$PREV_SHA" > /tmp/deploy-prev-sha
          git fetch origin && git checkout main && git pull --ff-only
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml build --build-arg GIT_SHA="${{ github.sha }}" api
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml run --rm api npx prisma migrate deploy
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml up -d --force-recreate --no-deps api

          echo "waiting for api health..."
          for i in {1..30}; do
            if curl -sf localhost:3000/api/v1/health >/dev/null; then
              echo "api health ok"
              break
            fi
            sleep 2
          done
          curl -sf localhost:3000/api/v1/health

          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml exec api sh -c 'test -w /data/artifacts && touch /data/artifacts/.deploy-write-test && rm -f /data/artifacts/.deploy-write-test'

          DEPLOYED_SHA=$(docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml exec api cat /app/.gitsha | tr -d '\n')
          if [ "$DEPLOYED_SHA" != "${{ github.sha }}" ]; then
            echo "deployed SHA mismatch: expected ${{ github.sha }}, got $DEPLOYED_SHA"
            exit 1
          fi

          BUILT_ID=$(docker inspect -f '{{.Id}}' tracking-trade-api:local)
          RUNNING_ID=$(docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml ps -q api | xargs -I {} docker inspect -f '{{.Image}}' {})
          if [ "$BUILT_ID" != "$RUNNING_ID" ]; then
            echo "deployed image mismatch: built $BUILT_ID, running $RUNNING_ID"
            exit 1
          fi

          docker image prune -f
          EOF
      - name: Rollback on failure
        if: failure()
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" <<'EOF'
          set -e
          cd /opt/tracking_trade
          install -d -o 100 -g 101 /opt/tracking_trade/artifacts
          chown -R 100:101 /opt/tracking_trade/artifacts
          PREV_SHA=$(cut -d= -f2 /tmp/deploy-prev-sha)
          git checkout "$PREV_SHA"
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml build --build-arg GIT_SHA="$PREV_SHA" api
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml up -d --force-recreate --no-deps api

          echo "waiting for api health after rollback..."
          for i in {1..30}; do
            if curl -sf localhost:3000/api/v1/health >/dev/null; then
              echo "api health ok"
              break
            fi
            sleep 2
          done
          curl -sf localhost:3000/api/v1/health

          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml exec api sh -c 'test -w /data/artifacts && touch /data/artifacts/.deploy-write-test && rm -f /data/artifacts/.deploy-write-test'

          docker image prune -f
          EOF
      - name: Notify Telegram
        if: always()
        run: |
          if [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] || [ -z "${{ secrets.ALERT_CHAT_ID }}" ]; then
            echo "notify secrets missing, skipping"
            exit 0
          fi
          STATUS="${{ steps.deploy.outcome }}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.ALERT_CHAT_ID }}" \
            --data-urlencode "text=deploy ${{ github.sha }}: ${STATUS}" || true
